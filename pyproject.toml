[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dikidi-api-client"
version = "0.1.1"
description = "Неофициальный Python SDK для CRM DIKIDI Business (Reverse-Engineered API)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = ["dikidi", "crm", "booking", "api-client", "sdk", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx[http2]>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/your-username/dikidi-api-client"
Repository = "https://github.com/your-username/dikidi-api-client"

[tool.hatch.build.targets.wheel]
packages = ["dikidi"]